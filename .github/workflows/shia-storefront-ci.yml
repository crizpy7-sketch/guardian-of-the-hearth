# CI for the Shia & Co. storefront living in shia-baby-storefront/.
#
# WHY THIS FILE EXISTS AT THE REPO ROOT
# ------------------------------------
# GitHub only runs workflows found in the repository's root .github/workflows.
# The storefront carries its own shia-baby-storefront/.github/workflows/ci.yml,
# which is correct for the day that directory becomes its own repository — but
# it does not execute here. Without this file the storefront's 61 tests would
# never run on a pull request.
#
# Both are kept deliberately: the nested one travels with the directory, this
# one verifies it today. Delete this file once the storefront moves out.

name: Shia Storefront CI

on:
  push:
    branches: [main]
    paths: ['shia-baby-storefront/**']
  pull_request:
    paths: ['shia-baby-storefront/**']
  workflow_dispatch:

# Path filters keep this off the game's own commits, so it never runs
# `npm test` against the game's package.json.
defaults:
  run:
    working-directory: shia-baby-storefront

jobs:
  verify:
    name: Verify storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install: the storefront has no build step by design.
      - name: Contract tests
        run: npm test

      # Defence in depth. tests/integrity.test.js also checks this, but a
      # committed secret is severe enough to warrant a second, independent gate.
      - name: Fail on committed secrets
        run: |
          if grep -rEn 'eyJ[A-Za-z0-9_-]{20,}\.' \
               --include='*.js' --include='*.html' --include='*.json' --include='*.md' . ; then
            echo "::error::A JWT-like secret appears to be committed."
            exit 1
          fi
          if [ -f .env ]; then
            echo "::error::.env must never be committed."
            exit 1
          fi
          echo "No committed secrets detected."
